version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node01
      - node02
      - node03
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  node01:
    build: ./cluster
    environment:
      - PORT=3001
      - NODE_ID=Nexus-Node-01
    depends_on:
      - redis

  node02:
    build: ./cluster
    environment:
      - PORT=3002
      - NODE_ID=Nexus-Node-02
    depends_on:
      - redis

  node03:
    build: ./cluster
    environment:
      - PORT=3003
      - NODE_ID=Nexus-Node-03-Failover
    depends_on:
      - redis